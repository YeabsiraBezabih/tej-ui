name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux windowing dev libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-matrix:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux windowing dev libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace

  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux windowing dev libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check tej-ui with --no-default-features
        run: cargo check -p tej-ui --no-default-features
      - name: Check tej-ui with --all-features
        run: cargo check -p tej-ui --all-features --all-targets
      - name: Test tej-ui with --all-features
        run: cargo test -p tej-ui --all-features
      - name: Check tej-ui-hal without GPU feature
        run: cargo check -p tej-ui-hal --no-default-features

  package-dry-run:
    name: Crates.io Package Dry-Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux windowing dev libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Verify cargo package --list across publishable crates
        run: |
          for crate in \
            tej-ui-core \
            tej-ui-layout \
            tej-ui-hal \
            tej-ui-text \
            tej-ui-view \
            tej-ui-platform-linux \
            tej-ui-platform-windows \
            tej-ui-platform-macos \
            tej-ui-platform-web \
            tej-ui-a11y \
            tej-ui-animation \
            tej-ui-icons \
            tej-ui-services \
            tej-ui-db-sync \
            tej-ui-widgets \
            tej-ui-devtools \
            tej-ui-3d \
            tej-ui-cli \
            tej-ui; do
            echo "=== Checking package manifest for $crate ==="
            cargo package --list -p "$crate" --allow-dirty
          done
